<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        #container{
           
            width:100%;
            height:100vh;
        }
        #navbar{
            height:75px;
            border:2px solid green;
            
            display:flex;
            justify-content:space-evenly;
            align-items: center;

        }
        #navbar img{
            height:150px;
            width:125px;
            border-radius: 40px;
            
        }
        #boxes{
        width:100%;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:row;
}

        #boxes img{
            height:300px;
            width:250px;
            margin:20px 100px;;
            border-radius: 40px;
            padding:40px 40px 40px 40px;
            box-shadow: inset 0 0 10px #000000, 0 0 10px #000000;
            
        }

        #boxes input{
            height:10px;
            width:250px;
            margin:20px 100px;
            border-radius: 40px;
            padding:40px 40px 40px 40px;
            border: 2px solid black;
            border-bottom: 2px solid black;
            text-align: center;
           
        }

        #boxes button{
            height:10px;
            width:250px;
            margin: 0px 100px;
            border-radius: 40px;
            padding:20px 20px 20px 20px ;
            background-color:green;
            color:white;
            font-size:20px;
            text-align: center;
            padding-bottom: 40px;
            
        }
        #boxes button:hover{
            background-color: darkgreen;
            cursor: pointer;
}



        

    </style>
</head>
<body>
    <div id="container">
        <div id="navbar">

        </div>

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTUDldNSUFz63BBKLZAAg1samVYXuJ_w6v0s5enHZqSxA&s=10" />

            </div>
